# Fails the push / pull request if any commit in the history adds a key, token, password or secret file.
# Local hooks (tools/install-secret-hooks.sh) stop it before the push; this catches commits from other machines.
name: secret-scan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: python3 tools/secret-scan.py --all
