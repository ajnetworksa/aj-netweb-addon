# Builds the AJ Netweb Remote Access add-on as ready-made images with the agent COMPILED (Nuitka),
# and pushes them to GitHub Container Registry:
#   ghcr.io/ajnetworksa/amd64-addon-ajnetweb_tunnel:<version>
#   ghcr.io/ajnetworksa/aarch64-addon-ajnetweb_tunnel:<version>
# Home Assistant then downloads these images instead of building from source (set "image" in
# ajnetweb_tunnel/config.json - see docs/remote-access-closed-source.md).
#
# Run it: Actions -> "Remote Access image" -> Run workflow, or push a tag  remote-access-v1.3.0
name: Remote Access image

on:
  workflow_dispatch:
  push:
    tags: ["remote-access-v*"]

permissions:
  contents: read
  packages: write

env:
  ADDON_DIR: ajnetweb_tunnel

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: Read version and base image
        id: meta
        run: |
          echo "version=$(jq -r .version ${ADDON_DIR}/config.json)" >> "$GITHUB_OUTPUT"
          echo "base=$(jq -r '.build_from["${{ matrix.arch }}"]' ${ADDON_DIR}/build.json)" >> "$GITHUB_OUTPUT"
          echo "frp=$(jq -r '.args.FRP_VERSION' ${ADDON_DIR}/build.json)" >> "$GITHUB_OUTPUT"
          echo "platform=$([ '${{ matrix.arch }}' = aarch64 ] && echo linux/arm64 || echo linux/amd64)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.ADDON_DIR }}
          platforms: ${{ steps.meta.outputs.platform }}
          push: true
          build-args: |
            BUILD_FROM=${{ steps.meta.outputs.base }}
            BUILD_ARCH=${{ matrix.arch }}
            FRP_VERSION=${{ steps.meta.outputs.frp }}
            AJN_AGENT_VERSION=${{ steps.meta.outputs.version }}
            AJN_COMPILE=true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-ajnetweb_tunnel:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-ajnetweb_tunnel:latest
          labels: |
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.meta.outputs.version }}

      - name: Check that no agent source is in the image
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-ajnetweb_tunnel:${{ steps.meta.outputs.version }}
          docker run --rm --platform ${{ steps.meta.outputs.platform }} --entrypoint sh "$IMG" -c \
            'ls /usr/lib/ajn; ! ls /usr/lib/ajn/*.py 2>/dev/null'
