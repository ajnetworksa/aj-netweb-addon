<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AJ Netweb UI preview</title><style id="theme"></style>
<style>
  html { background: var(--primary-background-color); }
  body { margin: 0; background: var(--lovelace-background); background-attachment: fixed; color: var(--primary-text-color); min-height: 100vh;
         font-family: -apple-system, Roboto, sans-serif; }
  .bar { position: sticky; top: 0; z-index: 3; display: flex; gap: 8px; padding: 8px 16px; background: rgba(0,0,0,.6);
         color: #fff; font-size: 13px; align-items: center; flex-wrap: wrap; }
  .bar select { font: inherit; }
  #view { display: grid; grid-auto-flow: row dense; grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
          gap: 24px var(--gap); padding: 8px var(--gap) 16px; margin: 0 auto; align-items: start; box-sizing: content-box; }
  .sec { display: grid; grid-template-columns: repeat(var(--gc, 12), minmax(0, 1fr)); grid-auto-rows: auto; gap: 8px; align-content: start; }
  .heading { font-size: 17px; font-weight: 600; padding: 14px 4px 2px; display: flex; gap: 8px; align-items: center; }
  .ph { background: var(--ha-card-background); border: 1px dashed var(--ha-card-border-color); border-radius: var(--ha-card-border-radius);
        padding: 14px; font-size: 12px; color: var(--secondary-text-color); min-height: 60px; }
</style></head>
<body>
  <div class="bar">AJ Netweb UI preview · view <select id="views"></select>
    <span>· URL params: theme, mode (dark|light), lang (en|ar), options (strategy JSON)</span></div>
  <div id="view"></div>
  <script type="module" src="preview.bundle.js"></script>
</body></html>
