<!doctype html>
<!-- Stand-in for the Music Assistant app in the preview. It uses the same colour variables as the real
     app (Vuetify --v-theme-* on .v-theme--dark / .v-theme--light, Tailwind tokens on :root / .dark),
     so the music library card's repaint can be checked without a Music Assistant server. -->
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Assistant (preview)</title>
<style>
  :root { --background: #f5f5f5; --foreground: #000; --card: #fff; --primary: #03a9f4; --primary-foreground: #fff;
          --muted: #e7e7e7; --muted-foreground: #666; --border: #d4d4d4; --sidebar: #fff; --sidebar-accent: rgba(0,0,0,.08); }
  .dark { --background: #181818; --foreground: #fff; --card: #232323; --muted: #2c2c2c; --muted-foreground: #a0a0a0;
          --border: #333; --sidebar: #232323; --sidebar-accent: rgba(255,255,255,.08); }
  .v-theme--dark { --v-theme-background: 24,24,24; --v-theme-on-background: 255,255,255; --v-theme-surface: 35,35,35;
                   --v-theme-on-surface: 255,255,255; --v-theme-primary: 3,169,244; --v-theme-on-primary: 255,255,255;
                   --v-theme-panel: 35,35,35; --v-theme-fg: 255,255,255; --v-theme-overlay: 24,24,24; --v-border-color: 255,255,255; }
  .v-theme--light { --v-theme-background: 245,245,245; --v-theme-on-background: 0,0,0; --v-theme-surface: 255,255,255;
                    --v-theme-on-surface: 0,0,0; --v-theme-primary: 3,169,244; --v-theme-on-primary: 255,255,255;
                    --v-theme-panel: 255,255,255; --v-theme-fg: 0,0,0; --v-theme-overlay: 231,231,231; --v-border-color: 0,0,0; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px system-ui, sans-serif; }
  .v-application { display: grid; grid-template-columns: 200px 1fr; grid-template-rows: 1fr auto; height: 100vh;
                   background: rgb(var(--v-theme-background)); color: rgb(var(--v-theme-on-background)); }
  nav { grid-row: 1 / 3; background: var(--sidebar); border-inline-end: 1px solid var(--border); padding: 14px 10px; }
  nav b { display: block; padding: 6px 10px 16px; font-size: 16px; }
  nav a { display: block; padding: 10px; border-radius: 8px; color: var(--foreground); text-decoration: none; }
  nav a.on { background: var(--sidebar-accent); color: var(--primary); font-weight: 600; }
  main { overflow: auto; padding: 18px; }
  h2 { margin: 4px 0 14px; font-size: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 14px; }
  .tile { background: rgb(var(--v-theme-panel)); border-radius: 10px; padding: 8px; border: 1px solid rgba(var(--v-border-color), .12); }
  .tile i { display: block; aspect-ratio: 1; border-radius: 6px; background: var(--muted); }
  .tile div { margin-top: 6px; font-weight: 600; } .tile span { color: var(--muted-foreground); font-size: 12px; }
  .chip { display: inline-block; padding: 6px 12px; border-radius: 999px; background: var(--primary); color: var(--primary-foreground); margin-bottom: 14px; }
  footer { grid-column: 2; display: flex; gap: 14px; align-items: center; padding: 12px 18px; background: rgb(var(--v-theme-surface));
           border-top: 1px solid rgba(var(--v-border-color), .12); }
  footer .play { width: 42px; height: 42px; border-radius: 50%; background: rgb(var(--v-theme-primary)); color: rgb(var(--v-theme-on-primary));
                 display: grid; place-items: center; font-size: 18px; }
  footer .bar { flex: 1; height: 4px; border-radius: 2px; background: var(--muted); } footer .bar i { display: block; width: 40%; height: 100%; background: var(--primary); }
  @media (max-width: 600px) { .v-application { grid-template-columns: 1fr; } nav { display: none; } footer { grid-column: 1; } }
</style>
</head>
<body>
<div class="v-application v-theme--dark">
  <nav><b>Music Assistant</b><a class="on" href="#">Home</a><a href="#">Artists</a><a href="#">Albums</a><a href="#">Playlists</a><a href="#">Radio</a><a href="#">Settings</a></nav>
  <main>
    <h2>Recently played</h2><span class="chip">Spotify · YouTube Music · Radio</span>
    <div class="grid">
      <div class="tile"><i></i><div>Evening Oud</div><span>Playlist</span></div>
      <div class="tile"><i></i><div>Quran Radio</div><span>Radio</span></div>
      <div class="tile"><i></i><div>Road Trip</div><span>Playlist</span></div>
      <div class="tile"><i></i><div>Kids Songs</div><span>Playlist</span></div>
      <div class="tile"><i></i><div>Mix FM</div><span>Radio</span></div>
      <div class="tile"><i></i><div>Focus</div><span>Album</span></div>
    </div>
  </main>
  <footer><span class="play">▶</span><div><b>Evening Oud</b><br><span style="color:var(--muted-foreground)">Majlis</span></div><div class="bar"><i></i></div></footer>
</div>
</body>
</html>
